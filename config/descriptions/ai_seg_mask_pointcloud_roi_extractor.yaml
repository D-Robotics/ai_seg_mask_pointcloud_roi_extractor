seg_mask:
  ros__parameters:
    debug:
      description: "调试模式"
      description_en: "Debug mode"
      type: "bool"
      default_value: "false"
      range: []
      unit: ""

    time_debug:
      description: "Check the time of each module"
      description_en: "Debug mode"
      type: "bool"
      default_value: "false"
      range: []
      unit: ""

    topic_check:
      description: "订阅的话题存在性检测"
      description_en: "Topic check"
      type: "bool"
      default_value: "false"
      range: []
      unit: ""

    depth_image_topic:
      description: "深度图话题名称"
      description_en: "Depth image topic name"
      type: "string"
      default_value: "/StereoNetNode/stereonet_depth"
      range: []
      unit: ""

    detect_info_topic:
      description: "分割检测信息话题名称"
      description_en: "Segmentation detect topic name"
      type: "string"
      default_value: "/hobot_dnn_detection"
      range: []
      unit: ""

    class_info_topic:
      description: "类别信息话题名称"
      description_en: "Class info topic name"
      type: "string"
      default_value: "/hobot_dnn_detection_info"
      range: []
      unit: ""

    camera_info_topic:
      description: "相机信息话题名称"
      description_en: "Camera info topic name"
      type: "string"
      default_value: "/StereoNetNode/stereonet_depth/camera_info"
      range: []
      unit: ""

    color_image_topic:
      description: "彩色图话题名称"
      description_en: "Color image topic name"
      type: "string"
      default_value: "/StereoNetNode/origin_left_image"
      range: []
      unit: ""

    filtered_mask_topic:
      description: "过滤后的mask话题名称"
      description_en: "Filtered mask image topic name"
      type: "string"
      default_value: "/filtered_depth_mask"
      range: []
      unit: ""

    filtered_depth_topic:
      description: "过滤后的深度图mask话题名称"
      description_en: "Filtered depth mask image topic name"
      type: "string"
      default_value: "/filtered_depth_img"
      range: []
      unit: ""

    filtered_cloud_topic:
      description: "过滤后的点云话题名称"
      description_en: "Filtered point cloud topic name"
      type: "string"
      default_value: "/filtered_depth_cloud"
      range: []
      unit: ""

    roi_cloud_topic:
      description: "ROI点云话题名称（标准 sensor_msgs/PointCloud2，逐点字段 x/y/z float32 + class_id int32 + confidence float32 + instance_id int32（帧内实例号）+ rgb uint32（调色板色，与 semantic_map/object_ids 同源）；仅语义建图链路使用，由 semantic_map 订阅）"
      description_en: "ROI point cloud topic name (standard sensor_msgs/PointCloud2 with per-point fields x/y/z float32 + class_id int32 + confidence float32 + instance_id int32 (per-frame box index) + rgb uint32 (palette color, same source as semantic_map/object_ids); used only by the semantic mapping chain, subscribed by semantic_map)"
      type: "string"
      default_value: "/roi/pointclouds"
      range: []
      unit: ""

    roi_visual_topic:
      description: "ROI分割叠加深度渲染图话题名称（仅语义建图可视化链路使用：bgr8 经 jpeg 编码后进 web 通道 2；空字符串表示不发布）"
      description_en: "ROI segment overlay depth render image topic name (semantic-map visualization chain only: bgr8 jpeg-encoded to web channel 2; empty string disables)"
      type: "string"
      default_value: "/roi/visual_depth_seg"
      range: []
      unit: ""

    confidence_threshold_file_path:
      description: "类别的置信度文件路径"
      description_en: "File path of confidence threshold for each class"
      type: "string"
      default_value: "model_classes_config.yaml"
      range: []
      unit: ""

    confidence_threshold_roi_file_path:
      description: "感兴趣类别的置信度文件路径"
      description_en: "File path of confidence threshold for each class for region of interest extraction"
      type: "string"
      default_value: "model_classes_roi_config.yaml"
      range: []
      unit: ""

    queue_size:
      description: "消息同步队列大小"
      description_en: "Queue size for message synchronization"
      type: "int"
      default_value: "10"
      range: []
      unit: ""

    allow_timestamp_deviation:
      description: "允许的时间戳偏差"
      description_en: "Allowable timestamp deviation for synchronization"
      type: "double"
      default_value: "0.5"
      range: []
      unit: "sec"

    min_depth:
      description: "最小深度值(小于此值的点被过滤)。调大:滤除镜头近处飞点/机身自遮挡;调小:需感知贴近视野的目标时"
      description_en: "Minimum depth value for filtering (points below are filtered out). Increase: remove near-field flying pixels / self-occlusion; decrease: to perceive targets very close to the camera"
      type: "double"
      default_value: "0.0"
      range: []
      unit: "m"

    max_depth:
      description: "最大深度值(大于此值的点被过滤)。调大:需感知更远目标(远处噪声随之增多);调小:远处背景干扰 ROI/障碍点云时"
      description_en: "Maximum depth value for filtering (points above are filtered out). Increase: to perceive farther targets (more far-field noise); decrease: when distant background interferes with the ROI/obstacle cloud"
      type: "double"
      default_value: "5.0"
      range: []
      unit: "m"

    dilate_iter_num:
      description: "感兴趣区域mask的膨胀迭代次数(每次约外扩1像素)。调大:分割mask偏小、目标边缘被截断时;调小:mask偏大、背景被卷进ROI时"
      description_en: "Number of dilation iterations for the mask of the region of interest (~1 px outward per iteration). Increase: mask under-segments and target edges are cut off; decrease: mask over-segments and background bleeds into the ROI"
      type: "int"
      default_value: "1"
      range: []
      unit: ""

    erode_iter_num_roi:
      description: "ROI 点云提取前对 ROI 专用语义 mask 的腐蚀迭代次数(0=禁用)。只作用于 ROI/语义地图链路——深度过滤链路消费未腐蚀的原始 mask、与上游一致(2026-10-08 链路拆分;拆分前该 mask 与障碍链路共享,≥3 曾致 costmap 障碍闪烁、导航卡顿 BUG-20260914)。按类收紧请用 erode_extra_class_names。调大:边界深度飞刺明显、语义地图轮廓外扩时;调小:ROI 点云/语义地图物体变小残缺时"
      description_en: "Erosion iterations on the ROI-dedicated segmentation mask before ROI point cloud extraction (0=disabled). ROI/semantic-map chain ONLY — the depth-filter chain consumes the pristine mask, upstream-identical and erosion-free (chain split 2026-10-08; pre-split the mask was shared with the obstacle pipeline and >=3 caused costmap flicker/navigation jank, BUG-20260914). Use erode_extra_class_names for per-class tightening. Increase: obvious boundary depth streaks / inflated map outlines; decrease: ROI cloud / map objects shrink or break up"
      type: "int"
      default_value: "1"
      range: [0, 5]
      unit: ""

    erode_extra_class_names:
      description: "额外腐蚀类别名单(逗号分隔,如 'chair,couch'):仅对这些类别的 ROI 专用语义 mask 像素追加腐蚀(只影响 ROI 点云/语义地图,不触碰深度过滤链路)。模型类别表中不存在的类名会被跳过并告警一次。用字符串而非数组:descriptions 解析工具只支持 bool/int/double/string"
      description_en: "Comma-separated class names receiving EXTRA erosion on the ROI-dedicated segmentation mask only (affects ROI pointcloud/semantic map; depth-filter chain untouched). Class names missing from the model class list are skipped with a one-shot warning. Plain string (not array): descriptions tooling only supports bool/int/double/string"
      type: "string"
      default_value: "chair"
      range: []
      unit: ""

    erode_extra_iter_num:
      description: "额外腐蚀迭代次数(作用于 erode_extra_class_names 中的类别,0=禁用,每次迭代边界收缩约1像素)。调大(+1):该类在语义地图/ROI点云中仍比实物大、轮廓外扩或渗入背景时;调小(-1):点云/地图中该类变小残缺(如椅腿丢失)时;0=关闭该类额外腐蚀。默认 2:椅子边界总收缩量等于实测有效的全局腐蚀 3"
      description_en: "Extra erosion iterations applied to erode_extra_class_names classes (0=disabled; ~1 px boundary shrink per iteration). Increase (+1): the class still renders larger than reality in the semantic map / ROI cloud (inflated outline bleeding into background). Decrease (-1): the class shrinks or breaks up in the map (e.g. chair legs disappear). 0 disables the extra erosion. Default 2 matches the empirically tuned global erosion of 3 for chair boundary shrink"
      type: "int"
      default_value: "2"
      range: [0, 5]
      unit: ""

    depth_continuity_check:
      description: "开启 ROI 点云深度连续性检查(3×3 同类邻域深度中位数,过滤孤立深度飞点)。默认关:实测对单帧整条生成的相干拖尾无效,孤立飞点已由 instance_depth_gate_tau 百分位门控覆盖,开启徒增 2~9ms/帧;保留作调试开关。只作用于 ROI/语义地图链路"
      description_en: "Enable depth continuity check (3x3 same-class neighborhood depth median) for ROI point cloud. Default OFF: field-tested ineffective against coherent single-frame tail streaks, and isolated flying pixels are already covered by the instance_depth_gate_tau percentile gate — keeping it ON only adds 2~9 ms/frame. Retained as a debug switch. ROI/semantic-map chain only"
      type: "bool"
      default_value: "false"
      range: []
      unit: ""

    max_depth_diff:
      description: "深度连续性检查的最大允许深度差(米)。仅 depth_continuity_check=true 时生效。调大:物体表面深度起伏大、有效点被误删时;调小:边界飞点仍残留时"
      description_en: "Maximum allowed depth difference from neighbor median for continuity check (meters). Only effective when depth_continuity_check=true. Increase: valid points wrongly removed on surfaces with large depth variation; decrease: boundary flying pixels persist"
      type: "double"
      default_value: "0.3"
      range: [0.05, 1.0]
      unit: "m"

    instance_depth_gate_tau:
      description: "实例级自适应百分位深度门控的最小边距(米,0=关闭):保留带=[p10-m, p90+m],m=max(该值, p90-p10 深度跨度)。带宽随物体自身深度跨度缩放——大物体远端边缘不误切,而'整条同时生成'的径向拖尾(背景深度整条拖出,内部自洽、局部 3x3 连续性检查看不见,实测)被整条切除。只作用于 ROI/语义地图链路。调大:点云仍出现整条径向拖尾/背景渗透时;调小或置0:目标远端边缘被截断、大物体点云残缺时"
      description_en: "Minimum margin (meters, 0=disabled) of the per-instance ADAPTIVE percentile depth gate: keep-band = [p10-m, p90+m], m = max(tau, p90-p10 span). Band scales with the object's own depth extent — large objects keep their far edges, while coherent radial tail streaks (background bleed generated in one shot, internally depth-consistent so the local 3x3 check cannot see them, user-tested) are cut entirely. ROI/semantic-map chain only. Increase: radial tail streaks / background bleed still visible in the cloud; decrease or 0: far edges of (large) objects truncated"
      type: "double"
      default_value: "0.3"
      range: [0.0, 2.0]
      unit: "m"

    camera_width:
      description: "相机输出图片宽度"
      description_en: "Camera output image width"
      type: "int"
      default_value: "640"
      range: []
      unit: ""

    camera_height:
      description: "相机输出图片高度"
      description_en: "Camera output image height"
      type: "int"
      default_value: "352"
      range: []
      unit: ""

    log_level:
      description: "日志级别"
      description_en: "Log level"
      type: "string"
      default_value: "info"
      range: ["debug", "info", "warn", "error"]
      unit: ""
  
    use_extractor:
      description: "是否进行感兴趣区域提取， true:=感兴趣区域提取, false:=感兴趣区域过滤"
      description_en: "Whether to perform region of interest extraction, true:= region of interest extraction, false:= region of interest filtering"
      type: "bool"
      default_value: "false"
      range: []
      unit: ""

    enable_roi_extraction:
      description: "ROI/语义建图链路总开关：false=不投递 ROI 点云提取与叠加渲染任务（每帧省约 135ms 工作线程耗时），仅保留深度过滤链路；true=正常提取并发布 /roi/pointclouds 与 /roi/visual_depth_seg。bring_up 按 run_semantic_map 下发——只有开了语义建图 ROI 链路才会运行"
      description_en: "Master switch for the ROI/semantic-map chain: false=skip the ROI point-cloud extraction and overlay-render tasks (~135 ms worker time per frame saved), keeping only the depth-filter chain; true=extract and publish /roi/pointclouds and /roi/visual_depth_seg normally. bring_up derives it from run_semantic_map — the ROI chain only runs when semantic mapping is enabled"
      type: "bool"
      default_value: "true"
      range: []
      unit: ""

    worker_threads:
      description: "常驻工作线程数(并行处理帧以提升帧率,上限3以避免与BPU抢核)"
      description_en: "Number of persistent worker threads (parallel frame processing for higher FPS, capped at 3 to avoid starving BPU cores)"
      type: "int"
      default_value: "2"
      range: []
      unit: ""

    max_pending_frames:
      description: "线程池待处理帧上限，超出则丢弃最旧帧（限制延迟与内存）；需 ≥ 单帧入队任务数 3（filter/roi/visual），否则双 worker 忙时 drop-oldest 系统性丢弃 filter 任务"
      description_en: "Max queued frames in the thread pool; oldest is dropped when exceeded (bounds latency and memory). Must be >= 3 tasks enqueued per frame (filter/roi/visual), otherwise drop-oldest systematically discards the filter task when both workers are busy"
      type: "int"
      default_value: "4"
      range: []
      unit: ""